<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" data-theme="dark">
<style>
  :root { --bg:#0B1426; --surface:#13203A; --text:#F4F1EA; --muted:#8A96AD; --rule:#2A3B5E; --primary:#2EC4B6; --danger:#FF5A5F; --success:#3DDC97; --paper:#F4F1EA; --ink:#0B1426; }
  svg[data-theme="light"] { --bg:#F7F4EC; --surface:#FFFFFF; --text:#0B1426; --muted:#5B6578; --rule:#C9CFDB; --primary:#0E9488; --danger:#D7333A; --success:#1B9E6A; --paper:#0B1426; --ink:#F4F1EA; }
  .bg { fill: var(--bg); }
  .t { fill: var(--text); font-family: "Inter", sans-serif; }
  .h { fill: var(--text); font-family: "Space Grotesk", sans-serif; font-weight: 500; }
  .m { fill: var(--muted); font-family: "JetBrains Mono", monospace; }
  .mt { fill: var(--muted); font-family: "Inter", sans-serif; }
  .rule { stroke: var(--rule); stroke-width: 1.5; }
  .strong { stroke: var(--text); stroke-width: 1.5; }
  .box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
  .arrow { stroke: var(--text); stroke-width: 2; fill: none; marker-end: url(#head); }
  .arrow.soft { stroke: var(--muted); }
  .arrow.primary { stroke: var(--primary); marker-end: url(#headp); }
  .arrow.danger { stroke: var(--danger); marker-end: url(#headd); }
  .stamp { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text)"/></marker>
  <marker id="headp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--primary)"/></marker>
  <marker id="headd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/></marker>
</defs>
<rect class="bg" width="1600" height="900"/><line class="strong" x1="80" y1="70" x2="1520" y2="70"/><text class="h" x="80" y="100" font-size="22" text-anchor="start" >Threat model</text><text class="m" x="1520" y="100" font-size="16" text-anchor="end" >every attack we try on stage, and what says no</text><text class="m" x="80" y="140" font-size="14" text-anchor="start" >attacker</text><text class="m" x="420" y="140" font-size="14" text-anchor="start" >attack</text><text class="m" x="760" y="140" font-size="14" text-anchor="start" >defence</text><line class="rule" x1="80" y1="152" x2="1520" y2="152"/><text class="h" x="80" y="200" font-size="21" text-anchor="start" >Dodgy treasurer</text><text class="t" x="420" y="200" font-size="19" text-anchor="start" >“Pay me this month”</text><text class="t" x="760" y="200" font-size="17" text-anchor="start" >no recipient setter; rotation changes need a vote plus timelock</text><g transform="rotate(-3 1383.36 184.5)"><rect x="1330" y="174" width="106.72" height="21.0" fill="none" stroke="var(--success)" stroke-width="2.5"/><rect x="1334" y="178" width="98.72" height="13.0" fill="none" stroke="var(--success)" stroke-width="1"/><text class="stamp" x="1383.36" y="188.7" font-size="14" fill="var(--success)" text-anchor="middle">no setter</text></g><line class="rule" x1="80" y1="230" x2="1520" y2="230"/><text class="h" x="80" y="286" font-size="21" text-anchor="start" >Dodgy treasurer</text><text class="t" x="420" y="286" font-size="19" text-anchor="start" >takes rand out of the account</text><text class="t" x="760" y="286" font-size="17" text-anchor="start" >proof of reserves: ReservesShort freezes payouts</text><g transform="rotate(-3 1368.24 270.5)"><rect x="1330" y="260" width="76.47999999999999" height="21.0" fill="none" stroke="var(--danger)" stroke-width="2.5"/><rect x="1334" y="264" width="68.47999999999999" height="13.0" fill="none" stroke="var(--danger)" stroke-width="1"/><text class="stamp" x="1368.24" y="274.7" font-size="14" fill="var(--danger)" text-anchor="middle">frozen</text></g><line class="rule" x1="80" y1="316" x2="1520" y2="316"/><text class="h" x="80" y="372" font-size="21" text-anchor="start" >Compromised relayer</text><text class="t" x="420" y="372" font-size="19" text-anchor="start" >records the same payment twice</text><text class="t" x="760" y="372" font-size="17" text-anchor="start" >seen[ref] refuses it: AlreadyRecorded</text><g transform="rotate(-3 1373.28 356.5)"><rect x="1330" y="346" width="86.56" height="21.0" fill="none" stroke="var(--danger)" stroke-width="2.5"/><rect x="1334" y="350" width="78.56" height="13.0" fill="none" stroke="var(--danger)" stroke-width="1"/><text class="stamp" x="1373.28" y="360.7" font-size="14" fill="var(--danger)" text-anchor="middle">refused</text></g><line class="rule" x1="80" y1="402" x2="1520" y2="402"/><text class="h" x="80" y="458" font-size="21" text-anchor="start" >Compromised relayer</text><text class="t" x="420" y="458" font-size="19" text-anchor="start" >invents a huge contribution</text><text class="t" x="760" y="458" font-size="17" text-anchor="start" >AmountTooLarge cap, and reserves fall short at close</text><g transform="rotate(-3 1368.24 442.5)"><rect x="1330" y="432" width="76.47999999999999" height="21.0" fill="none" stroke="var(--success)" stroke-width="2.5"/><rect x="1334" y="436" width="68.47999999999999" height="13.0" fill="none" stroke="var(--success)" stroke-width="1"/><text class="stamp" x="1368.24" y="446.7" font-size="14" fill="var(--success)" text-anchor="middle">capped</text></g><line class="rule" x1="80" y1="488" x2="1520" y2="488"/><text class="h" x="80" y="544" font-size="21" text-anchor="start" >Compromised relayer</text><text class="t" x="420" y="544" font-size="19" text-anchor="start" >pays the wrong person</text><text class="t" x="760" y="544" font-size="17" text-anchor="start" >beneficiaryHash check, public events, members vote it out</text><g transform="rotate(-3 1373.28 528.5)"><rect x="1330" y="518" width="86.56" height="21.0" fill="none" stroke="var(--success)" stroke-width="2.5"/><rect x="1334" y="522" width="78.56" height="13.0" fill="none" stroke="var(--success)" stroke-width="1"/><text class="stamp" x="1373.28" y="532.7" font-size="14" fill="var(--success)" text-anchor="middle">checked</text></g><line class="rule" x1="80" y1="574" x2="1520" y2="574"/><text class="h" x="80" y="630" font-size="21" text-anchor="start" >Vote thief</text><text class="t" x="420" y="630" font-size="19" text-anchor="start" >replays an old signed vote</text><text class="t" x="760" y="630" font-size="17" text-anchor="start" >EIP-712 domain plus a per-signer nonce</text><g transform="rotate(-3 1363.2 614.5)"><rect x="1330" y="604" width="66.4" height="21.0" fill="none" stroke="var(--success)" stroke-width="2.5"/><rect x="1334" y="608" width="58.400000000000006" height="13.0" fill="none" stroke="var(--success)" stroke-width="1"/><text class="stamp" x="1363.2" y="618.7" font-size="14" fill="var(--success)" text-anchor="middle">nonce</text></g><line class="rule" x1="80" y1="660" x2="1520" y2="660"/><text class="h" x="80" y="716" font-size="21" text-anchor="start" >Stolen member card</text><text class="t" x="420" y="716" font-size="19" text-anchor="start" >votes as the victim</text><text class="t" x="760" y="716" font-size="17" text-anchor="start" >social recovery: RotateKey moves the member to a spare card</text><g transform="rotate(-3 1373.28 700.5)"><rect x="1330" y="690" width="86.56" height="21.0" fill="none" stroke="var(--success)" stroke-width="2.5"/><rect x="1334" y="694" width="78.56" height="13.0" fill="none" stroke="var(--success)" stroke-width="1"/><text class="stamp" x="1373.28" y="704.7" font-size="14" fill="var(--success)" text-anchor="middle">rotated</text></g><line class="rule" x1="80" y1="746" x2="1520" y2="746"/><text class="mt" x="80" y="850" font-size="17" text-anchor="start" >Not enforced, and said out loud: the relayer is trusted to report what the bank did, and the attestor to sign the real balance. Both can be voted out.</text></svg>