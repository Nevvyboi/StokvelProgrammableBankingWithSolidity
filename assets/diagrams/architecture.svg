<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" data-theme="dark">
<style>
  :root { --bg:#0B1426; --surface:#13203A; --text:#F4F1EA; --muted:#8A96AD; --rule:#2A3B5E; --primary:#2EC4B6; --danger:#FF5A5F; --success:#3DDC97; --paper:#F4F1EA; --ink:#0B1426; }
  svg[data-theme="light"] { --bg:#F7F4EC; --surface:#FFFFFF; --text:#0B1426; --muted:#5B6578; --rule:#C9CFDB; --primary:#0E9488; --danger:#D7333A; --success:#1B9E6A; --paper:#0B1426; --ink:#F4F1EA; }
  .bg { fill: var(--bg); }
  .t { fill: var(--text); font-family: "Inter", sans-serif; }
  .h { fill: var(--text); font-family: "Space Grotesk", sans-serif; font-weight: 500; }
  .m { fill: var(--muted); font-family: "JetBrains Mono", monospace; }
  .mt { fill: var(--muted); font-family: "Inter", sans-serif; }
  .rule { stroke: var(--rule); stroke-width: 1.5; }
  .strong { stroke: var(--text); stroke-width: 1.5; }
  .box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
  .arrow { stroke: var(--text); stroke-width: 2; fill: none; marker-end: url(#head); }
  .arrow.soft { stroke: var(--muted); }
  .arrow.primary { stroke: var(--primary); marker-end: url(#headp); }
  .arrow.danger { stroke: var(--danger); marker-end: url(#headd); }
  .stamp { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text)"/></marker>
  <marker id="headp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--primary)"/></marker>
  <marker id="headd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/></marker>
</defs>
<rect class="bg" width="1600" height="900"/><line class="strong" x1="80" y1="70" x2="1520" y2="70"/><text class="h" x="80" y="100" font-size="22" text-anchor="start" >Architecture</text><text class="m" x="1520" y="100" font-size="16" text-anchor="end" >Investec holds the rand · the chain holds the rulebook · the relayer carries messages</text><text class="h" x="80" y="150" font-size="34" text-anchor="start" >Investec</text><text class="mt" x="80" y="180" font-size="18" text-anchor="start" >the money</text><text class="h" x="600" y="150" font-size="34" text-anchor="start" >Relayer</text><text class="mt" x="600" y="180" font-size="18" text-anchor="start" >the messenger</text><text class="h" x="1120" y="150" font-size="34" text-anchor="start" >Chain</text><text class="mt" x="1120" y="180" font-size="18" text-anchor="start" >the rulebook</text><rect class="box" x="80" y="210" width="400" height="120"/><text class="h" x="100" y="245" font-size="22" text-anchor="start" >Stokvel account</text><text class="m" x="100" y="278.0" font-size="15" text-anchor="start" >balance, transactions</text><text class="m" x="100" y="299.75" font-size="15" text-anchor="start" >STK-03 references on credits</text><rect class="box" x="80" y="360" width="400" height="120"/><text class="h" x="100" y="395" font-size="22" text-anchor="start" >Member cards</text><text class="m" x="100" y="428.0" font-size="15" text-anchor="start" >afterTransaction rounds up to R10</text><text class="m" x="100" y="449.75" font-size="15" text-anchor="start" >transfermultiple to the pool</text><rect class="box" x="80" y="510" width="400" height="120"/><text class="h" x="100" y="545" font-size="22" text-anchor="start" >Members' bank accounts</text><text class="m" x="100" y="578.0" font-size="15" text-anchor="start" >paymultiple on payout day</text><text class="m" x="100" y="599.75" font-size="15" text-anchor="start" >saved beneficiaries</text><rect class="box" x="600" y="210" width="400" height="420"/><text class="h" x="620" y="245" font-size="22" text-anchor="start" >Four loops, no database</text><line class="rule" x1="620" y1="268" x2="980" y2="268"/><text class="h" x="620" y="290" font-size="19" text-anchor="start" >contributions</text><text class="m" x="620" y="316" font-size="13.5" text-anchor="start" >poll credits → recordContribution(id, cents, keccak(txId))</text><line class="rule" x1="620" y1="350" x2="980" y2="350"/><text class="h" x="620" y="372" font-size="19" text-anchor="start" >reserves</text><text class="m" x="620" y="398" font-size="13.5" text-anchor="start" >balance → attestor signs → postReserves</text><line class="rule" x1="620" y1="432" x2="980" y2="432"/><text class="h" x="620" y="454" font-size="19" text-anchor="start" >payouts</text><text class="m" x="620" y="480" font-size="13.5" text-anchor="start" >closeRound → PayoutDue → pay → confirmPayout</text><line class="rule" x1="620" y1="514" x2="980" y2="514"/><text class="h" x="620" y="536" font-size="19" text-anchor="start" >votes</text><text class="m" x="620" y="562" font-size="13.5" text-anchor="start" >HTTP: signed EIP-712 votes → voteBySig</text><text class="mt" x="620" y="610" font-size="14" text-anchor="start" >restart it any time: it re-reads bank and chain</text><rect class="box" x="1120" y="210" width="400" height="230"/><text class="h" x="1140" y="245" font-size="22" text-anchor="start" >Stokvel.sol</text><text class="m" x="1140" y="278.0" font-size="15" text-anchor="start" >members, paidCents, seen[ref]</text><text class="m" x="1140" y="299.75" font-size="15" text-anchor="start" >pot, unsettled, reserves</text><text class="m" x="1140" y="321.5" font-size="15" text-anchor="start" >round % 6 is the recipient</text><text class="m" x="1140" y="343.25" font-size="15" text-anchor="start" >votes by memberId, timelock</text><text class="m" x="1140" y="365.0" font-size="15" text-anchor="start" >holds no funds, ever</text><rect class="box" x="1120" y="470" width="400" height="160"/><text class="h" x="1140" y="505" font-size="22" text-anchor="start" >Readers</text><text class="m" x="1140" y="538.0" font-size="15" text-anchor="start" >projector dashboard, signing station,</text><text class="m" x="1140" y="559.75" font-size="15" text-anchor="start" >audience phones: events only,</text><text class="m" x="1140" y="581.5" font-size="15" text-anchor="start" >verify on Basescan</text><path class="arrow primary" d="M480 270 L600 270"/><text class="m" x="540" y="258" font-size="13" text-anchor="middle" >poll</text><path class="arrow primary" d="M1000 270 L1120 270"/><text class="m" x="1060" y="258" font-size="13" text-anchor="middle" >write</text><path class="arrow soft" d="M1120 400 L1000 400"/><text class="m" x="1060" y="388" font-size="13" text-anchor="middle" >PayoutDue</text><path class="arrow soft" d="M600 570 L480 570"/><text class="m" x="540" y="558" font-size="13" text-anchor="middle" >pay</text><path class="arrow soft" d="M480 420 C 540 420, 540 300, 480 300" transform="translate(0,-40)"/><text class="m" x="520" y="340" font-size="13" text-anchor="start" >round-up</text><line class="rule" x1="80" y1="700" x2="1520" y2="700"/><text class="t" x="80" y="740" font-size="20" text-anchor="start" >Two keys. The relayer records what the bank did. The attestor signs what the bank holds. Neither can choose who gets paid.</text><text class="mt" x="80" y="775" font-size="17" text-anchor="start" >Sandbox and testnet only. Mock mode mirrors the Investec sandbox on the laptop for the parts the stateless sandbox can't show.</text></svg>