  <marker id="headp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--primary)"/></marker>
  <marker id="headd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/></marker>
</defs>
<rect class="bg" width="1600" height="900"/><g transform="translate(28 16) scale(0.965)"><line class="strong" x1="80" y1="70" x2="1520" y2="70"/><text class="h" x="80" y="100" font-size="22" text-anchor="start" >Blockchain in 60 seconds</text><text class="m" x="1520" y="100" font-size="16" text-anchor="end" >each block carries the hash of the one before it</text><text class="h" x="80" y="150" font-size="24" text-anchor="start" >Honest</text><rect x="80" y="170" width="240" height="150" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/><text class="h" x="96" y="204" font-size="22" text-anchor="start" fill="var(--text)">#1</text><text class="t" x="96" y="238" font-size="17" text-anchor="start" >Lerato paid R5,000</text><text class="m" x="96" y="270" font-size="14" text-anchor="start" >prev  0000</text><text class="m" x="96" y="296" font-size="14" text-anchor="start" >hash  9f2a</text><path class="arrow" d="M320 245 L368 245"/><rect x="370" y="170" width="240" height="150" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/><text class="h" x="386" y="204" font-size="22" text-anchor="start" fill="var(--text)">#2</text><text class="t" x="386" y="238" font-size="17" text-anchor="start" >Thabo paid R5,000</text><text class="m" x="386" y="270" font-size="14" text-anchor="start" >prev  9f2a</text><text class="m" x="386" y="296" font-size="14" text-anchor="start" >hash  3c71</text><path class="arrow" d="M610 245 L658 245"/><rect x="660" y="170" width="240" height="150" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/><text class="h" x="676" y="204" font-size="22" text-anchor="start" fill="var(--text)">#3</text><text class="t" x="676" y="238" font-size="17" text-anchor="start" >Aisha paid R5,000</text><text class="m" x="676" y="270" font-size="14" text-anchor="start" >prev  3c71</text><text class="m" x="676" y="296" font-size="14" text-anchor="start" >hash  b04e</text><path class="arrow" d="M900 245 L948 245"/><rect x="950" y="170" width="240" h