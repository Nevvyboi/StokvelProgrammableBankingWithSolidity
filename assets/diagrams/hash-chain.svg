--danger)" stroke-width="1"/><text class="stamp" x="1250.48" y="649.4" font-size="28" fill="var(--danger)" text-anchor="middle">broken</text></g><line class="rule" x1="80" y1="720" x2="1520" y2="720"/><text class="t" x="80" y="760" font-size="20" text-anchor="start" >Every block's hash covers the block before it. Rewrite one line and every later hash stops matching.</text><text class="mt" x="80" y="795" font-size="17" text-anchor="start" >Thousands of computers hold the same chain, so the rewrite would have to fool all of them at once. That is what “nobody can erase it” means.</text></g></svg>