<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" data-theme="dark">
<style>
  :root { --bg:#0B1426; --surface:#13203A; --text:#F4F1EA; --muted:#8A96AD; --rule:#2A3B5E; --primary:#2EC4B6; --danger:#FF5A5F; --success:#3DDC97; --paper:#F4F1EA; --ink:#0B1426; }
  svg[data-theme="light"] { --bg:#F7F4EC; --surface:#FFFFFF; --text:#0B1426; --muted:#5B6578; --rule:#C9CFDB; --primary:#0E9488; --danger:#D7333A; --success:#1B9E6A; --paper:#0B1426; --ink:#F4F1EA; }
  .bg { fill: var(--bg); }
  .t { fill: var(--text); font-family: "Inter", sans-serif; }
  .h { fill: var(--text); font-family: "Space Grotesk", sans-serif; font-weight: 500; }
  .m { fill: var(--muted); font-family: "JetBrains Mono", monospace; }
  .mt { fill: var(--muted); font-family: "Inter", sans-serif; }
  .rule { stroke: var(--rule); stroke-width: 1.5; }
  .strong { stroke: var(--text); stroke-width: 1.5; }
  .box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
  .arrow { stroke: var(--text); stroke-width: 2; fill: none; marker-end: url(#head); }
  .arrow.soft { stroke: var(--muted); }
  .arrow.primary { stroke: var(--primary); marker-end: url(#headp); }
  .arrow.danger { stroke: var(--danger); marker-end: url(#headd); }
  .stamp { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text)"/></marker>
  <marker id="headp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--primary)"/></marker>
  <marker id="headd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/></marker>
</defs>
<rect class="bg" width="1600" height="900"/><g transform="translate(28 16) scale(0.965)"><line class="strong" x1="80" y1="70" x2="1520" y2="70"/><text class="h" x="80" y="100" font-size="22" text-anchor="start" >A round, start to finish</text><text class="m" x="1520" y="100" font-size="16" text-anchor="end" >the contract's month</text><rect class="box" x="80" y="150" width="440" height="240"/><text class="h" x="100" y="202" font-size="40" text-anchor="start" fill="var(--primary)">1</text><text class="h" x="150" y="196" font-size="26" text-anchor="start" >Contributions</text><text class="t" x="100" y="242" font-size="18" text-anchor="start" >STK-nn credits land in the bank</text><text class="m" x="100" y="280" font-size="16" text-anchor="start" >recordContribution</text><text class="mt" x="100" y="320" font-size="14" text-anchor="start" >refuses with</text><text class="m" x="100" y="346" font-size="14" text-anchor="start" fill="var(--danger)">AlreadyRecorded · AmountTooLarge</text><path class="arrow" d="M520 270 L558 270"/><rect class="box" x="560" y="150" width="440" height="240"/><text class="h" x="580" y="202" font-size="40" text-anchor="start" fill="var(--primary)">2</text><text class="h" x="630" y="196" font-size="26" text-anchor="start" >Attestation</text><text class="t" x="580" y="242" font-size="18" text-anchor="start" >attestor signs the balance, every 20 s</text><text class="m" x="580" y="280" font-size="16" text-anchor="start" >postReserves</text><text class="mt" x="580" y="320" font-size="14" text-anchor="start" >refuses with</text><text class="m" x="580" y="346" font-size="14" text-anchor="start" fill="var(--danger)">BadAttestation · ReservesStale</text><path class="arrow" d="M1000 270 L1038 270"/><rect class="box" x="1040" y="150" width="440" height="240"/><text class="h" x="1060" y="202" font-size="40" text-anchor="start" fill="var(--primary)">3</text><text class="h" x="1110" y="196" font-size="26" text-anchor="start" >Close</text><text class="t" x="1060" y="242" font-size="18" text-anchor="start" >anyone calls it after month end</text><text class="m" x="1060" y="280" font-size="16" text-anchor="start" >closeRound</text><text class="mt" x="1060" y="320" font-size="14" text-anchor="start" >refuses with</text><text class="m" x="1060" y="346" font-size="14" text-anchor="start" fill="var(--danger)">RoundStillOpen · ReservesStale · ReservesShort</text><rect class="box" x="80" y="450" width="440" height="240"/><text class="h" x="100" y="502" font-size="40" text-anchor="start" fill="var(--primary)">4</text><text class="h" x="150" y="496" font-size="26" text-anchor="start" >Payout due</text><text class="t" x="100" y="542" font-size="18" text-anchor="start" >recipient is round % 6, no setter</text><text class="m" x="100" y="580" font-size="16" text-anchor="start" >PayoutDue event</text><path class="arrow" d="M520 570 L558 570"/><rect class="box" x="560" y="450" width="440" height="240"/><text class="h" x="580" y="502" font-size="40" text-anchor="start" fill="var(--primary)">5</text><text class="h" x="630" y="496" font-size="26" text-anchor="start" >Bank pays</text><text class="t" x="580" y="542" font-size="18" text-anchor="start" >relayer calls paymultiple</text><text class="m" x="580" y="580" font-size="16" text-anchor="start" >Investec API</text><path class="arrow" d="M1000 570 L1038 570"/><rect class="box" x="1040" y="450" width="440" height="240"/><text class="h" x="1060" y="502" font-size="40" text-anchor="start" fill="var(--primary)">6</text><text class="h" x="1110" y="496" font-size="26" text-anchor="start" >Confirmed</text><text class="t" x="1060" y="542" font-size="18" text-anchor="start" >with the bank's payment reference</text><text class="m" x="1060" y="580" font-size="16" text-anchor="start" >confirmPayout</text><text class="mt" x="1060" y="620" font-size="14" text-anchor="start" >refuses with</text><text class="m" x="1060" y="646" font-size="14" text-anchor="start" fill="var(--danger)">WrongBeneficiary · UnknownPayout</text><path class="arrow" d="M1300 390 L1300 420 L300 420 L300 448"/><path class="arrow primary" d="M1300 690 L1300 740 L40 740 L40 270 L78 270"/><text class="m" x="700" y="770" font-size="16" text-anchor="middle" fill="var(--primary)">next round opens, the recipient moves on by one</text><text class="t" x="80" y="850" font-size="20" text-anchor="start" >Money never touches the chain. The chain only says whether the bank may pay, and to whom.</text></g></svg>