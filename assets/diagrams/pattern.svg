<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" data-theme="dark">
<style>
  :root { --bg:#0B1426; --surface:#13203A; --text:#F4F1EA; --muted:#8A96AD; --rule:#2A3B5E; --primary:#2EC4B6; --danger:#FF5A5F; --success:#3DDC97; --paper:#F4F1EA; --ink:#0B1426; }
  svg[data-theme="light"] { --bg:#F7F4EC; --surface:#FFFFFF; --text:#0B1426; --muted:#5B6578; --rule:#C9CFDB; --primary:#0E9488; --danger:#D7333A; --success:#1B9E6A; --paper:#0B1426; --ink:#F4F1EA; }
  .bg { fill: var(--bg); }
  .t { fill: var(--text); font-family: "Inter", sans-serif; }
  .h { fill: var(--text); font-family: "Space Grotesk", sans-serif; font-weight: 500; }
  .m { fill: var(--muted); font-family: "JetBrains Mono", monospace; }
  .mt { fill: var(--muted); font-family: "Inter", sans-serif; }
  .rule { stroke: var(--rule); stroke-width: 1.5; }
  .strong { stroke: var(--text); stroke-width: 1.5; }
  .box { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
  .arrow { stroke: var(--text); stroke-width: 2; fill: none; marker-end: url(#head); }
  .arrow.soft { stroke: var(--muted); }
  .arrow.primary { stroke: var(--primary); marker-end: url(#headp); }
  .arrow.danger { stroke: var(--danger); marker-end: url(#headd); }
  .stamp { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text)"/></marker>
  <marker id="headp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--primary)"/></marker>
  <marker id="headd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/></marker>
</defs>
<rect class="bg" width="1600" height="900"/><line class="strong" x1="80" y1="70" x2="1520" y2="70"/><text class="h" x="80" y="100" font-size="22" text-anchor="start" >The pattern</text><text class="m" x="1520" y="100" font-size="16" text-anchor="end" >money stays in the bank · rules live on chain · the relayer is a messenger only</text><text class="h" x="80" y="240" font-size="72" text-anchor="start" fill="var(--text)">Money</text><text class="m" x="80" y="285" font-size="20" text-anchor="start" >Investec</text><line class="rule" x1="80" y1="310" x2="520" y2="310"/><text class="t" x="80" y="350.0" font-size="21" text-anchor="start" >holds every rand</text><text class="t" x="80" y="380.45" font-size="21" text-anchor="start" >pays members through the API</text><text class="t" x="80" y="410.9" font-size="21" text-anchor="start" >the sandbox on stage, production in life</text><text class="h" x="580" y="240" font-size="72" text-anchor="start" fill="var(--primary)">Rules</text><text class="m" x="580" y="285" font-size="20" text-anchor="start" >Stokvel.sol</text><line class="rule" x1="580" y1="310" x2="1020" y2="310"/><text class="t" x="580" y="350.0" font-size="21" text-anchor="start" >who paid, whose turn, what is owed</text><text class="t" x="580" y="380.45" font-size="21" text-anchor="start" >refuses what the rules refuse</text><text class="t" x="580" y="410.9" font-size="21" text-anchor="start" >public, cheap to read, never holds funds</text><text class="h" x="1080" y="240" font-size="72" text-anchor="start" fill="var(--muted)">Messages</text><text class="m" x="1080" y="285" font-size="20" text-anchor="start" >the relayer</text><line class="rule" x1="1080" y1="310" x2="1520" y2="310"/><text class="t" x="1080" y="350.0" font-size="21" text-anchor="start" >carries facts both ways</text><text class="t" x="1080" y="380.45" font-size="21" text-anchor="start" >signs nothing that decides anything</text><text class="t" x="1080" y="410.9" font-size="21" text-anchor="start" >kill it and restart it, nothing is lost</text><line class="strong" x1="80" y1="520" x2="1520" y2="520"/><text class="h" x="80" y="560" font-size="26" text-anchor="start" >What the messenger cannot do</text><g transform="rotate(-4 128.88 603.5)"><rect x="80" y="590" width="97.75999999999999" height="27.0" fill="none" stroke="var(--danger)" stroke-width="2.5"/><rect x="84" y="594" width="89.75999999999999" height="19.0" fill="none" stroke="var(--danger)" stroke-width="1"/><text class="stamp" x="128.88" y="608.9" font-size="18" fill="var(--danger)" text-anchor="middle">cannot</text></g><text class="h" x="80" y="680" font-size="24" text-anchor="start" >pick a recipient</text><text class="mt" x="80" y="712" font-size="16" text-anchor="start" >there is no setter; the order is the order</text><g transform="rotate(-4 488.88 603.5)"><rect x="440" y="590" width="97.75999999999999" height="27.0" fill="none" stroke="var(--danger)" stroke-width="2.5"/><rect x="444" y="594" width="89.75999999999999" height="19.0" fill="none" stroke="var(--danger)" stroke-width="1"/><text class="stamp" x="488.88" y="608.9" font-size="18" fill="var(--danger)" text-anchor="middle">cannot</text></g><text class="h" x="440" y="680" font-size="24" text-anchor="start" >repeat a payment</text><text class="mt" x="440" y="712" font-size="16" text-anchor="start" >seen[ref] makes every Investec id single use</text><g transform="rotate(-4 848.88 603.5)"><rect x="800" y="590" width="97.75999999999999" height="27.0" fill="none" stroke="var(--danger)" stroke-width="2.5"/><rect x="804" y="594" width="89.75999999999999" height="19.0" fill="none" stroke="var(--danger)" stroke-width="1"/><text class="stamp" x="848.88" y="608.9" font-size="18" fill="var(--danger)" text-anchor="middle">cannot</text></g><text class="h" x="800" y="680" font-size="24" text-anchor="start" >invent reserves</text><text class="mt" x="800" y="712" font-size="16" text-anchor="start" >the attestor is a different key</text><g transform="rotate(-4 1208.88 603.5)"><rect x="1160" y="590" width="97.75999999999999" height="27.0" fill="none" stroke="var(--danger)" stroke-width="2.5"/><rect x="1164" y="594" width="89.75999999999999" height="19.0" fill="none" stroke="var(--danger)" stroke-width="1"/><text class="stamp" x="1208.88" y="608.9" font-size="18" fill="var(--danger)" text-anchor="middle">cannot</text></g><text class="h" x="1160" y="680" font-size="24" text-anchor="start" >outvote the members</text><text class="mt" x="1160" y="712" font-size="16" text-anchor="start" >votes are card signatures, counted per member</text><text class="h" x="80" y="820" font-size="26" text-anchor="start" >“We didn't replace the trust. We wrote it down where nobody can erase it.”</text></svg>