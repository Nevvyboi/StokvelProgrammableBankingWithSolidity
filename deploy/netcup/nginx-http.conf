# deploy/netcup: the talk's port 80 block, inside DataBrew's nginx container. Serves the Let's
# Encrypt challenge from certbot's existing webroot and sends everything else to HTTPS.
# setup.sh fills in __DOMAIN__ and writes the result to /etc/letsencrypt/stokvel/site.conf.

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}
