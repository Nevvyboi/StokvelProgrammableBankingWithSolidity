# deploy/netcup: the talk's HTTPS block, the nginx version of deploy/Caddyfile. Same public paths,
# same password-protected levers, so deploy/check.sh tests it unchanged. setup.sh fills in
# __DOMAIN__ and __BIND__ (the host's address on the databrew_backend network, where the three
# services listen) and appends it to the port 80 block once the certificate exists.
#
# Every name here starts with stokvel_ so nothing collides with DataBrew's, floati's or redline's.

upstream stokvel_stage   { server __BIND__:3000; }
upstream stokvel_relayer { server __BIND__:4000; }
upstream stokvel_mock    { server __BIND__:4100; }

# a member's signature makes the relayer spend gas; a generous limit, the signing station is one laptop
limit_req_zone $binary_remote_addr zone=stokvel_sign:1m rate=2r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    # ------------------------------------------------ the relayer: what the public pages need
    # GET feed, bank, health, nonce: what the projector, the phones and /sign read
    location = /relayer/feed   { proxy_pass http://stokvel_relayer/feed; }
    location = /relayer/bank   { proxy_pass http://stokvel_relayer/bank; }
    location = /relayer/health { proxy_pass http://stokvel_relayer/health; }
    location ^~ /relayer/nonce/ { proxy_pass http://stokvel_relayer/nonce/; }
    # POST join, votes: a member's signature. The contract checks it, not us
    location = /relayer/join  { limit_req zone=stokvel_sign burst=20 nodelay; proxy_pass http://stokvel_relayer/join; }
    location = /relayer/votes { limit_req zone=stokvel_sign burst=20 nodelay; proxy_pass http://stokvel_relayer/votes; }

    # ------------------------------------------------ presenter only: the levers
    # the relayer's admin, propose, execute and webhook routes; the mock bank (steal, swipe, refund)
    location ^~ /relayer/ {
        auth_basic "presenter";
        auth_basic_user_file /etc/letsencrypt/stokvel/htpasswd;
        proxy_pass http://stokvel_relayer/;
    }
    location ^~ /mock/ {
        auth_basic "presenter";
        auth_basic_user_file /etc/letsencrypt/stokvel/htpasswd;
        proxy_pass http://stokvel_mock/;
    }
    # the run sheet, and the card-keys route (off on a public server: DEMO_MODE=false)
    location = /presenter {
        auth_basic "presenter";
        auth_basic_user_file /etc/letsencrypt/stokvel/htpasswd;
        proxy_pass http://stokvel_stage;
    }
    location ^~ /presenter/ {
        auth_basic "presenter";
        auth_basic_user_file /etc/letsencrypt/stokvel/htpasswd;
        proxy_pass http://stokvel_stage;
    }
    location = /api/keys {
        auth_basic "presenter";
        auth_basic_user_file /etc/letsencrypt/stokvel/htpasswd;
        proxy_pass http://stokvel_stage;
    }

    # ------------------------------------------------ the stage app
    # the projector (/), /sign, /watch and the read-only chain proxy (/api/rpc)
    location / {
        proxy_pass http://stokvel_stage;
    }
}
